name: 每日更新指标数据

on:
  schedule:
    # 美东时间每天约 14:05-15:05（UTC 19:05；夏令时 EDT 15:05，冬令时 EST 14:05）
    - cron: '5 19 * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [main]
    paths:
      - 'fetch/**'
      - 'index.html'
      - '.github/workflows/**'
      # 注意：bot 每日只提交 data/，不在上述路径内，不会触发死循环

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r fetch/requirements.txt

      - name: 抓取并计算指标
        run: python3 fetch/run_all.py

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "每日指标数据更新 $(date -u +%F)"
          git push
